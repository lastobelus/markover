name: App Sandbox spike

on:
  pull_request:
    paths:
      - '.github/workflows/app-sandbox-spike.yml'
      - 'config/macos/app-sandbox-spike/**'
      - 'scripts/app-sandbox-spike.ts'
      - 'test/app-sandbox-spike.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-sandbox-spike-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apple-silicon:
    name: Apple Silicon feasibility evidence
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run App Sandbox feasibility probe
        run: npm run spike:app-sandbox

      - name: Upload sanitized feasibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-sandbox-spike-arm64
          path: tmp/app-sandbox-spike/evidence.json
          if-no-files-found: error
          retention-days: 14
