name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.13.0'
          - '24'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed files for whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA..$HEAD_SHA"
          else
            git show --check --format= "$HEAD_SHA"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        run: npm run check

      - name: Run tests
        run: npm run test:built

      - name: Configure Electron sandbox
        if: matrix.node-version == '22.13.0'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Run bundled Electron smoke
        if: matrix.node-version == '22.13.0'
        run: xvfb-run --auto-servernum npm run smoke:built -- --timeout=60

      - name: Upload smoke failure evidence
        if: failure() && matrix.node-version == '22.13.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-failure
          path: tmp/smoke-failures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify tracked files are unchanged
        run: git diff --exit-code

  packaged-smoke:
    name: Packaged smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package hardened ad-hoc app
        run: npm run package:mac

      - name: Archive app and checksum
        shell: bash
        run: |
          architecture="$(node -p process.arch)"
          mkdir -p artifact/verification
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Markover-darwin-${architecture}/Markover.app" \
            "artifact/Markover-darwin-${architecture}.zip"
          (
            cd artifact
            shasum -a 256 "Markover-darwin-${architecture}.zip" \
              > "Markover-darwin-${architecture}.zip.sha256"
          )

      - name: Verify exact native artifact
        shell: bash
        run: |
          architecture="$(node -p process.arch)"
          version="$(node -p "require('./package.json').version")"
          npm run release:preflight -- verify-macos \
            "--archive=artifact/Markover-darwin-${architecture}.zip" \
            "--checksum=artifact/Markover-darwin-${architecture}.zip.sha256" \
            "--architecture=${architecture}" \
            "--version=${version}" \
            "--trust-mode=ad-hoc"

      - name: Exercise packaged happy path
        shell: bash
        run: |
          architecture="$(node -p process.arch)"
          version="$(node -p "require('./package.json').version")"
          npm run smoke:packaged -- \
            "--archive=artifact/Markover-darwin-${architecture}.zip" \
            "--checksum=artifact/Markover-darwin-${architecture}.zip.sha256" \
            "--architecture=${architecture}" \
            "--version=${version}" \
            "--trust-mode=ad-hoc" \
            "--evidence-kind=ci" \
            "--evidence=smoke-evidence/packaged-smoke-${architecture}.json"

      - name: Retain packaged smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-smoke-${{ matrix.runner }}
          path: smoke-evidence/
          if-no-files-found: error
          retention-days: 30
