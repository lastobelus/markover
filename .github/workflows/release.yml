name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        run: >-
          test "${GITHUB_REF_NAME}"
          = "v$(node -p "require('./packages/cli/package.json').version")"
      - run: npm run check
      - run: npm test

  mac-app:
    needs: test
    strategy:
      matrix:
        runner:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:mac
      - name: Archive app and checksum
        shell: bash
        run: |
          architecture="$(node -p process.arch)"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Markover-darwin-${architecture}/Markover.app" \
            "release/Markover-darwin-${architecture}.zip"
          cd release
          shasum -a 256 "Markover-darwin-${architecture}.zip" \
            > "Markover-darwin-${architecture}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.runner }}
          path: release/*

  cli:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:cli
      - name: Pack bootstrap CLI
        run: |
          mkdir -p release
          npm pack ./packages/cli --pack-destination release
          mv release/*.tgz release/markover-cli.tgz
          cd release
          shasum -a 256 markover-cli.tgz > markover-cli.tgz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: release/*

  publish:
    needs:
      - mac-app
      - cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --title "Markover ${GITHUB_REF_NAME}"
          --generate-notes
          release/*
