name: Bug report
description: Report a reproducible problem with Markover
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Markover. For usage questions, use GitHub Discussions. Report suspected vulnerabilities through private vulnerability reporting, not this form.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and its impact clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Open…
        2. Select…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect Markover to do?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What did Markover do instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Markover version or commit
      description: Enter the release version, or "development checkout" followed by the commit hash.
      placeholder: "0.1.1 or development checkout 11e565f"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.6"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac architecture
      options:
        - Apple Silicon (arm64)
        - Intel (x64)
        - Other or unknown
    validations:
      required: true
  - type: dropdown
    id: launch_method
    attributes:
      label: Launch method
      options:
        - Public npx bootstrap command
        - Previously downloaded packaged app
        - Development checkout with npm start
        - Legacy review command
        - Other
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Minimal sanitized diagnostics
      description: Include only the smallest relevant stderr excerpt or diagnostic output. Remove tokens, credentials, private repository details, usernames, local paths, and review content.
      render: text
  - type: textarea
    id: attachments
    attributes:
      label: Additional context or attachments
      description: Drag in sanitized screenshots or add any other context that helps explain the problem.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing Issues and Discussions and did not find the same report.
          required: true
        - label: This report is not a security vulnerability. I will use [private vulnerability reporting](https://github.com/lastobelus/markover/security/advisories/new) for suspected vulnerabilities.
          required: true
        - label: I removed secrets, private review content, identifying local paths, and other sensitive data from everything posted here.
          required: true
